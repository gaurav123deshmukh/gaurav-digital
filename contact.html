<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Gaurav Digital</title>
    <link rel="icon" type="image/png" href="logo2.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Centering the entire contact section */
        .contact-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 5% 100px;
            text-align: center;
        }

        .contact-info h2 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            margin-bottom: 50px; 
            text-transform: uppercase;
            line-height: 1.2;
        }

        /* CONTACT FORM - Balanced glassmorphism card */
        .contact-form {
            background: rgba(255, 255, 255, 0.03);
            padding: 50px;
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 254, 0.1);
            text-align: left;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #00f2fe;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        /* MOBILE RESPONSIVE FIXES */
        @media (max-width: 850px) {
            .contact-form {
                padding: 30px 20px;
                /* Added margin to prevent WhatsApp button from overlapping inputs */
                margin-bottom: 80px; 
            }
            .form-group input, .form-group textarea {
                padding: 15px;
                /* Setting font-size to 16px prevents automatic zoom-in on iPhones */
                font-size: 16px; 
            }
            .contact-info h2 {
                margin-bottom: 30px;
            }
        }
    </style>
</head>
