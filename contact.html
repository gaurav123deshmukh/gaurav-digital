    <nav class="navbar">
        <a href="index.html" class="logo">

    <header class="hero" style="height: 35vh; min-height: 300px;">
        <div class="hero-content" style="margin-top: 5rem; text-align: center; width: 100%;">
            <h1 class="anim-hero">Let's <span class="gradient-text">Connect</span></h1>
        </div>
    </header>

    <section class="contact-section">
        
        <div class="contact-form-centered anim-card">
            <h2>Send us your details</h2>
            
            <form action="#" method="POST" class="contact-form">
                <div class="input-group">
                    <input type="text" id="name" name="name" required placeholder="Name">
                </div>
                
                <div class="input-group">
                    <input type="tel" id="contact" name="contact" required placeholder="Contact No.">
                </div>

                <div class="input-group">
                    <input type="email" id="email" name="email" required placeholder="Email ID">
                </div>
                
                <div class="input-group">
                    <textarea id="message" name="message" rows="4" required placeholder="Message"></textarea>
                </div>
                
                <button type="submit" class="btn-submit">SUBMIT DETAILS</button>
            </form>
        </div>
        
    </section>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-logo">
                <a href="index.html">
                    <img src="logo2.png" alt="Gaurav Digital Logo" class="footer-logo-img">
                </a>
            </div>
            
            <div class="footer-middle">
                <div class="footer-tagline">Innovate. Dominate. Scale.</div>
                <div class="footer-social">
                    <a href="https://www.linkedin.com/company/gaurav-digital/" target="_blank" title="LinkedIn">
                        <img src="li.png.png" alt="LinkedIn">
                    </a>
                    <a href="https://www.facebook.com/gauravdigitalseo/" target="_blank" title="Facebook">
                        <img src="fb.png.png" alt="Facebook">
                    </a>
                    <a href="https://www.instagram.com/gaurav_digital_ads/" target="_blank" title="Instagram">
                        <img src="insta.png" alt="Instagram">
                    </a>
                    <a href="https://x.com/GauravDigitalad" target="_blank" title="X (Twitter)">
                        <img src="x.png.png" alt="X">
                    </a>
                    <a href="https://www.youtube.com/@gauravdigitalmarketer" target="_blank" title="YouTube">
                        <img src="yt.png.png" alt="YouTube">
                    </a>
                </div>
            </div>

            <div class="footer-contact">
                <p><a href="mailto:contact@gauravdeshmukh.co.in">contact@gauravdeshmukh.co.in</a></p>
                <p><a href="tel:+918850480687">+91 88504 80687</a></p>
            </div>
        </div>
        
        <div class="footer-bottom">
