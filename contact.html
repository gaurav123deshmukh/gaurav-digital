<!DOCTYPE html>

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        .contact-section {
            padding: 10rem 5% 8rem;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        @media screen and (max-width: 768px) {
            .contact-section {
                padding: 140px 5% 6rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Gauravv Digital Logo" class="logo-img">
        </a>
        
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>

        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </nav>

    <section class="contact-section">
        <div class="contact-form-centered anim-card">
            <h2>Send us your details</h2>
            
            <form action="YOUR_SHEET_MONKEY_URL" method="POST" class="contact-form">
                
                <input type="hidden" name="_send_email" value="gaurav2deshmukh089@gmail.com">
                
                <input type="hidden" name="x-success" value="contact.html">
                
                <div class="input-group">
                    <input type="text" name="Name" required placeholder="Name">
                </div>
                
                <div class="input-group">
                    <input type="tel" name="Contact no." required placeholder="Contact No.">
                </div>

                <div class="input-group">
                    <input type="email" name="Email" required placeholder="Email ID">
                </div>
                
                <div class="input-group">
                    <textarea name="Message" rows="5" required placeholder="Message"></textarea>
                </div>
                
                <button type="submit" class="btn-submit">SUBMIT DETAILS</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-logo">
                <a href="index.html">
                    <img src="logo.png" alt="Gauravv Digital Logo" class="footer-logo-img">
                </a>
            </div>
            
            <div class="footer-middle">
                <div class="footer-tagline">Innovate. Dominate. Scale.</div>
                <div class="footer-social">
                    <a href="https://www.linkedin.com/company/gaurav-digital/" target="_blank"><img src="li.png.png" alt="LinkedIn"></a>
                    <a href="https://www.facebook.com/gauravdigitalseo/" target="_blank"><img src="fb.png.png" alt="Facebook"></a>
                    <a href="https://www.instagram.com/gaurav_digital_ads/" target="_blank"><img src="insta.png" alt="Instagram"></a>
                    <a href="https://x.com/GauravDigitalad" target="_blank"><img src="x.png.png" alt="X"></a>
                    <a href="https://www.youtube.com/@gauravdigitalmarketer" target="_blank"><img src="yt.png.png" alt="YouTube"></a>
                </div>
            </div>

            <div class="footer-contact">
                <p><a href="mailto:contact@gauravdeshmukh.co.in">contact@gauravdeshmukh.co.in</a></p>
                <p><a href="tel:+918850480687">+91 88504 80687</a></p>
            </div>
        </div>
        
        <div class="footer-bottom">
            <p>&copy; 2026 Gauravv Digital. All rights reserved.</p>
        </div>
    </footer>

    <a href="https://wa.me/918850480687" class="whatsapp-float" target="_blank"><img src="wa.png" alt="WhatsApp Chat"></a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const hamburger = document.querySelector(".hamburger");
        const navMenu = document.querySelector(".nav-links");

        hamburger.addEventListener("click", () => {
            hamburger.classList.toggle("active");
            navMenu.classList.toggle("active");
        });

        document.querySelectorAll(".nav-links a").forEach(n => n.addEventListener("click", () => {
            hamburger.classList.remove("active");
            navMenu.classList.remove("active");
        }));

        gsap.from(".contact-form-centered", {
            duration: 1.2,
            y: 50,
            opacity: 0,
            ease: "power4.out"
        });
    </script>
</body>
</html>
