<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>दिवाळीच्या हार्दिक शुभेच्छा</title>

<style>
:root {
  --gold: #ffd98a;
  --cream: #fff1d4;
  --muted: #d9c9bd;
  --line: rgba(255,220,155,.3);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: var(--cream);
  background: radial-gradient(ellipse at top,#59304d,#21152e 48%,#100c1d);
}

.corner-star,
.star-button,
#cornerStar,
.corner-decoration {
  display: none !important;
}

.links {
  width: min(1100px,92%);
  margin: 65px auto 25px;
  text-align: center;
}

.links h2 {
  color: var(--gold);
  font-family: Georgia,serif;
  font-size: clamp(25px,4vw,38px);
  margin-bottom: 30px;
  text-shadow: 0 5px 20px #ffb95b44;
}

.link-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 22px;
  max-width: 780px;
  margin: auto;
  perspective: 1000px;
}

.link-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 22px;
  min-height: 125px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.025));
  text-decoration: none;
  color: var(--cream);
  text-align: left;
  box-shadow: 0 15px 35px #0005,inset 0 1px #ffffff20;
  transition: .4s ease;
  transform-style: preserve-3d;
  animation: cardAppear .8s ease both;
  overflow: hidden;
}

.link-card:nth-child(2) { animation-delay: .2s; }

.link-card:hover {
  transform: translateY(-9px) rotateX(4deg) rotateY(-3deg);
  border-color: var(--gold);
  box-shadow: 0 25px 45px #0007,0 0 28px #ffbe5f33;
}

.link-icon {
  width: 82px;
  height: 82px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  padding: 6px;
  border-radius: 17px;
  background: white;
  box-shadow: 0 8px 22px #0004;
  overflow: hidden;
}

.link-icon img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.link-info b {
  display: block;
  color: var(--gold);
  font-size: 17px;
  margin-bottom: 8px;
}

.link-info small {
  display: block;
  color: var(--muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}

.link-card::after {
  content: "";
  position: absolute;
  width: 100px;
  height: 100px;
  top: -50px;
  right: -50px;
  background: #ffbe5f26;
  filter: blur(25px);
  border-radius: 50%;
  pointer-events: none;
}

@keyframes cardAppear {
  from { opacity: 0; transform: translateY(25px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

footer {
  text-align: center;
  padding: 35px 15px;
  color: var(--muted);
  font-size: 12px;
}

@media(max-width:600px) {
  .links { margin-top: 45px; }
  .link-grid { grid-template-columns: 1fr; gap: 14px; }
  .link-card { padding: 17px; min-height: 105px; }
  .link-icon { width: 68px; height: 68px; }
  .link-info b { font-size: 15px; }
  .link-info small { font-size: 11px; }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<section class="links">
  <h2>आमच्या कामाला भेट द्या</h2>

  <div class="link-grid">

    <!-- GAURAV DIGITAL -->
    <a class="link-card"
       href="https://gauravdeshmukh.co.in/"
       target="_blank"
       rel="noopener noreferrer">

      <span class="link-icon">
        <img
          src="logo%20(2).png"
          alt="Gaurav Digital Logo">
      </span>

      <span class="link-info">
        <b>Gaurav Digital</b>
        <small>gauravdeshmukh.co.in</small>
      </span>
    </a>

    <!-- SCHRAMM ADLABS -->
    <a class="link-card"
       href="https://www.schrammadlabs.com/"
       target="_blank"
       rel="noopener noreferrer">

      <span class="link-icon">
        <img
          src="WhatsApp%20Image%202026-09-23%20at%2009.58.08.jpeg"
          alt="Schramm AdLabs Logo">
      </span>

      <span class="link-info">
        <b>Schramm AdLabs</b>
        <small>schrammadlabs.com</small>
      </span>
    </a>

  </div>
</section>

<footer>आपला · गौरव</footer>

</body>
</html>
