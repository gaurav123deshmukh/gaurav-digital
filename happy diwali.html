<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100c1d">
<title>Happy Diwali</title>
<style>
:root{--gold:#ffd98a;--cream:#fff1d4;--muted:#d9c9bd;--line:rgba(255,220,155,.3)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--cream);background:radial-gradient(ellipse at 50% 0%,#59304d 0%,#21152e 48%,#100c1d 100%);display:flex;flex-direction:column;justify-content:center}
.corner-star,.star-button,#cornerStar,.corner-decoration{display:none!important}
.links{width:min(1100px,92%);margin:65px auto 25px;text-align:center}
.links h1{color:var(--gold);font-family:Georgia,serif;font-size:clamp(27px,4vw,42px);margin:0 0 12px;text-shadow:0 5px 25px #ffb95b55}
.links .subtitle{color:var(--muted);font-size:14px;margin-bottom:34px;line-height:1.7}
.link-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:820px;margin:auto;perspective:1200px}
.link-card{position:relative;display:flex;align-items:center;gap:20px;padding:24px;min-height:145px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.025));text-decoration:none;color:var(--cream);text-align:left;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.12);transition:transform .4s ease,box-shadow .4s ease,border-color .4s ease;animation:cardAppear .9s ease both;transform-style:preserve-3d}
.link-card:nth-child(2){animation-delay:.2s}
.link-card:hover{transform:translateY(-10px) rotateX(4deg) rotateY(-3deg);border-color:var(--gold);box-shadow:0 28px 55px rgba(0,0,0,.5),0 0 30px rgba(255,190,95,.2)}
.link-icon{width:100px;height:100px;flex-shrink:0;display:grid;place-items:center;padding:7px;border-radius:18px;background:#fff;box-shadow:0 9px 25px #0005;overflow:hidden;transition:transform .4s ease}
.link-card:hover .link-icon{transform:translateZ(25px) scale(1.06)}
.link-icon img{width:100%;height:100%;object-fit:contain;display:block}
.link-info{position:relative;z-index:1}
.link-info b{display:block;color:var(--gold);font-size:19px;margin-bottom:9px}
.link-info small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.link-card::before{content:"";position:absolute;width:150px;height:150px;top:-80px;right:-55px;background:rgba(255,190,95,.18);filter:blur(35px);border-radius:50%;pointer-events:none}
.link-card::after{content:"✦";position:absolute;bottom:10px;right:18px;font-size:24px;color:rgba(255,217,138,.25);animation:sparkle 3s ease-in-out infinite;pointer-events:none}
@keyframes cardAppear{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes sparkle{0%,100%{opacity:.25;transform:rotate(0) scale(.8)}50%{opacity:1;transform:rotate(45deg) scale(1.3)}}
footer{text-align:center;padding:35px 15px;color:var(--muted);font-size:12px;letter-spacing:2px}
@media(max-width:800px){.link-grid{gap:16px}.link-card{padding:18px}.link-icon{width:80px;height:80px}.link-info b{font-size:16px}}
@media(max-width:600px){.links{margin:40px auto 20px}.link-grid{grid-template-columns:1fr;gap:16px}.link-card{min-height:112px;padding:17px;border-radius:19px;gap:15px}.link-icon{width:72px;height:72px;border-radius:14px}.link-info b{font-size:16px}.link-info small{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="links">
  <h1>आमच्या कामाला भेट द्या</h1>
  <p class="subtitle">तुमच्या व्यवसायाच्या डिजिटल प्रवासासाठी आमच्या वेबसाइटला भेट द्या.</p>
  <div class="link-grid">
    <a class="link-card" href="https://gauravdeshmukh.co.in/" target="_blank" rel="noopener noreferrer" aria-label="Visit Gaurav Digital website">
      <span class="link-icon"><img src="logo%20(2).png" alt="Gaurav Digital Logo"></span>
      <span class="link-info"><b>Gaurav Digital</b><small>gauravdeshmukh.co.in</small></span>
    </a>
    <a class="link-card" href="https://www.schrammadlabs.com/" target="_blank" rel="noopener noreferrer" aria-label="Visit Schramm AdLabs website">
      <span class="link-icon"><img src="WhatsApp%20Image%202026-09-23%20at%2009.58.08.jpeg" alt="Schramm AdLabs Logo"></span>
      <span class="link-info"><b>Schramm AdLabs</b><small>schrammadlabs.com</small></span>
    </a>
  </div>
</section>
<footer>आपला · गौरव</footer>
</body>
</html>
