<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Digital | High-Tech Marketing</title>
    <!-- High-tech font integration -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Gradient logic from the 'DIGITAL' text in logo.png */
            --logo-gradient: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            --dark-bg: #050505;
            /* Watery, translucent header base */
            --watery-header: rgba(10, 15, 25, 0.35); 
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* --- 3-SECTION WATERY HEADER --- */
        .navbar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; /* Left, Middle, Right sections */
            align-items: center;
            padding: 15px 4%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: var(--watery-header);
            
            /* High-tech fluid blur (Watery effect) */
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            
            border-bottom: 1px solid rgba(0, 242, 254, 0.15);
            transition: all 0.4s ease;
        }

        /* LEFT: BIG LOGO */
        .nav-left { display: flex; justify-content: flex-start; }
        .nav-logo {
            height: 90px; /* Big logo as requested */
            width: auto;
            transition: transform 0.3s ease;
        }
        .nav-logo:hover { transform: scale(1.03); }

        /* MIDDLE: SOCIAL MEDIA LINKS */
        .nav-middle { display: flex; justify-content: center; gap: 20px; }
        .nav-middle img {
            width: 24px;
            filter: invert(1);
            opacity: 0.7;
            transition: 0.3s;
        }
        .nav-middle a:hover img {
            opacity: 1;
            transform: translateY(-3px);
            filter: drop-shadow(0 0 8px #00f2fe);
        }

        /* RIGHT: CONTACT DETAILS */
        .nav-right { display: flex; flex-direction: column; align-items: flex-end; }
        .nav-right a {
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            margin: 2px 0;
            transition: 0.3s;
        }
        .nav-right a:hover { opacity: 0.8; }

        /* --- HERO SECTION --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at 50% 50%, #101a25 0%, #050505 100%);
            padding-top: 140px;
        }

        h1, .gradient-text {
            background: var(--logo-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            text-transform: uppercase;
        }

        .hero h1 { font-size: clamp(3rem, 10vw, 6.5rem); margin-bottom: 10px; }
        .hero p { color: var(--text-dim); max-width: 600px; }

        /* --- FOOTER --- */
        .site-footer {
            padding: 80px 10% 40px;
            background: #020202;
            text-align: center;
            border-top: 1px solid rgba(0, 242, 254, 0.1);
        }
        .f-logo { height: 110px; margin-bottom: 30px; }
        
        .footer-contact .contact-item { font-size: 1.2rem; margin: 15px 0; }
        .footer-contact a { text-decoration: none; font-weight: 700; }
        
        /* --- WHATSAPP FLOAT --- */
        .whatsapp-float {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 70px;
            z-index: 1000;
            transition: 0.3s;
        }
        .whatsapp-float:hover { transform: scale(1.1); }

        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 900px) {
            .navbar { grid-template-columns: 1fr 1fr; padding: 10px 5%; }
            .nav-middle { display: none; } /* Hide middle links on mobile for space */
            .nav-logo { height: 60px; }
            .nav-right a { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- WATERY 3-SECTION HEADER -->
    <nav class="navbar">
        <div class="nav-left">
            <img src="logo.png" alt="Gaurav Digital Logo" class="nav-logo">
        </div>
        
        <div class="nav-middle">
            <a href="#"><img src="x.png" alt="X"></a>
            <a href="#"><img src="insta.png" alt="Instagram"></a>
            <a href="#"><img src="yt.png" alt="YouTube"></a>
            <a href="#"><img src="fb.png" alt="Facebook"></a>
        </div>
        
        <div class="nav-right">
            <a href="tel:+917506113382" class="gradient-text">+91 7506113382</a>
            <a href="mailto:gaurav2deshmukh09@gmail.com" class="gradient-text">gaurav2deshmukh09@gmail.com</a>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>GAURAV DIGITAL</h1>
        <p>Expert Digital Marketing solutions in Mumbai with a focus on transparency and tailored growth.</p>
    </section>

    <!-- FOOTER -->
    <footer class="site-footer">
        <img src="logo.png" alt="Gaurav Digital" class="f-logo">
        
        <div class="footer-contact">
            <p class="contact-item">
                <a href="tel:+917506113382" class="gradient-text">+91 7506113382</a>
            </p>
            <p class="contact-item">
                <a href="mailto:gaurav2deshmukh09@gmail.com" class="gradient-text">gaurav2deshmukh09@gmail.com</a>
            </p>
        </div>
        <p style="color: #444; font-size: 0.8rem; margin-top: 40px;">© 2026 Gaurav Digital. Results-Driven Marketing.</p>
    </footer>

    <!-- FLOATING WHATSAPP -->
    <a href="https://wa.me/917506113382" class="whatsapp-float">
        <img src="wa.png" alt="Contact Gaurav" style="width: 100%;">
    </a>

</body>
</html>
